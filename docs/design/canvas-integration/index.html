<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FinanceBot · Canvas integration prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="reviewbar">
    <div><strong>DESIGN PREVIEW</strong><span>Canvas → FinanceBot</span><small>交互原型 · 所有数据及授权均为模拟</small></div>
    <div class="actions">
      <button data-action="demo">查看已连接示例</button>
      <button data-action="student-demo">学生体验</button>
      <button data-action="reset">从头体验</button>
    </div>
  </div>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Workspace navigation"></aside>
    <div class="workspace">
      <header class="topbar">
        <button class="mobile-nav" data-action="menu" aria-label="Toggle navigation" aria-expanded="false">☰</button>
        <div id="breadcrumb"></div>
        <div class="actions"><span id="role-label">Instructor workspace</span><span class="avatar" id="top-avatar">AT</span></div>
      </header>
      <main id="screen" class="page" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
