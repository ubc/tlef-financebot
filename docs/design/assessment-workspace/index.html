<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FinanceBot · Assessment workspace review</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body data-theme="light">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="prototype-bar">
    <span><strong>DESIGN REVIEW</strong> Assessment workspace <small>Sample data · no changes are saved</small></span>
    <button id="theme-toggle" type="button" aria-label="Switch to dark mode">Dark mode</button>
  </div>
  <div class="shell">
    <aside class="sidebar" aria-label="Instructor navigation">
      <div class="brand"><span class="brand-mark">F</span><strong>FinanceBot</strong></div>
      <p class="role-label">INSTRUCTOR WORKSPACE</p>
      <div class="course-context">
        <span class="course-back">← All courses</span>
        <strong>PHYS 100 · Introduction to Physics</strong>
        <small>Winter Term 1, 2026/27 · Section 001</small>
      </div>
      <nav class="primary-nav" aria-label="Course workspace">
        <p class="nav-heading">COURSE</p>
        <button type="button" data-nav="home"><span class="nav-icon">⌂</span> Course Home</button>
        <button type="button" data-nav="content"><span class="nav-icon">▤</span> Content <small>Sources · LOs · Questions</small></button>
        <button type="button" data-nav="catalog" class="active" aria-current="page"><span class="nav-icon">◫</span> Assessments <span class="nav-count">2</span></button>
        <button type="button" data-nav="insights"><span class="nav-icon">↗</span> Insights <small>Coverage · Analytics · Flags</small></button>
        <p class="nav-heading">MANAGE</p>
        <button type="button" data-nav="team"><span class="nav-icon">♙</span> Teaching team</button>
        <button type="button" data-nav="settings"><span class="nav-icon">⚙</span> Course settings</button>
        <button type="button" data-nav="help"><span class="nav-icon">?</span> Help & Tutorials</button>
      </nav>
      <div class="sidebar-foot">Stephen <span>Instructor</span></div>
    </aside>
    <div class="main-column">
      <header class="topbar"><div id="breadcrumb">PHYS 100 <span>›</span> Assessments</div><div class="topbar-right"><span class="role-chip">Instructor ⌄</span><span class="avatar" aria-hidden="true">ST</span></div></header>
      <main id="main" tabindex="-1"><div id="app" aria-live="polite"></div></main>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
