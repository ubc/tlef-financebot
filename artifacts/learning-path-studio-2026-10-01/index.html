    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
  }

  .preseeding-row [data-label]::before {
    content: attr(data-label);
    margin-bottom: 0.15rem;
    color: var(--muted);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .preseeding-row__lo {
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
    font-weight: 650;
  }

  .preseeding-row__action .btn {
    width: 100%;
  }
}

.content-run-history {
  margin-top: 1.25rem;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

.content-run-history .section-title,
.content-run-history .detail-section-title {
  margin-top: 0;
}

.content-run-status {
  display: block;
  margin: 0.55rem 0;
}

/* Recent Generation Activity as a disclosure (preseeding.ts renderRuns):
   closed by default, the summary carries the counts. */
.content-run-history--collapsible {
  padding: 0;
}

/* "End all active runs" sits outside the disclosure so it stays reachable
   while the history is collapsed (a button inside <summary> is nested
   interactive content). */
.content-run-history__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.5rem;
  margin-top: 1.25rem;
}

.content-run-history__actions .material-row__error {
  margin: 0;
  margin-right: auto;
}

.content-run-history__actions + .content-run-history {
  margin-top: 0.5rem;
}

.content-run-history__summary {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.85rem 1rem;
  cursor: pointer;
  list-style: none;
}

.content-run-history__summary::-webkit-details-marker {
  display: none;
}

.content-run-history__summary::before {
  content: '▸';
  color: var(--muted);
  font-size: 0.9rem;
}

.content-run-history--collapsible[open] > .content-run-history__summary::before {
  content: '▾';
}

.content-run-history__summary .detail-section-title {
  margin: 0;
}

.content-run-history--collapsible[open] > .content-run-history__summary {
  border-bottom: 1px solid var(--border);
}

.content-run-history--collapsible > .content-run-status {
  margin: 0.55rem 1rem;
}

.content-run-history--collapsible > .content-run-status:last-child {
  margin-bottom: 1rem;
}

.content-run-status__target {
  color: var(--muted);
}

/* Buttons that sit in a form-row grid beside labeled fields (Save setup,
   Run setup, Insert @mention): bottom-aligned with the inputs and the same
   height as `.input` (identical padding-block and 1px border). */
.preseeding-form__row > .btn--field {
  align-self: end;
  padding: 0.55rem 1rem;
  font-size: inherit;
}

/* Bottom-align every cell in a form row: when the Also-integrate cell grows
   by a row of chips, the Questions select beside it stays level with the
   picker instead of floating at the top of the row. */
.preseeding-form__row > .form-field {
  align-self: end;
}

/* Multi-LO generation: the secondary-objective chips under the form's
   Target LO row (preseeding.ts). */

.lo-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.lo-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.4rem 0.3rem 0.75rem;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 0.82rem;
}

.lo-chip--warn {
  border-color: color-mix(in srgb, var(--instr-amber-fg) 45%, transparent);
  background: var(--instr-amber-bg);
  color: var(--instr-amber-fg);
}

.lo-chip__note {
  font-size: 0.72rem;
  opacity: 0.85;
}

.lo-chip__remove {
  padding: 0 0.3rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}

.lo-chip__remove:hover {
  background: color-mix(in srgb, var(--text) 12%, transparent);
}

.content-run-status--failed {
  border-color: color-mix(in srgb, var(--instr-red-fg) 35%, transparent);
  background: var(--instr-red-bg);
  color: var(--instr-red-fg);
}

/* Ended by an instructor: a deliberate stop, not a failure. */
.content-run-status--ended {
  border-color: var(--border);
  background: var(--surface-2);
  color: var(--text);
}

.content-run-status__note {
  margin: 0.35rem 0 0;
  color: var(--muted);
}

.content-run-status--partial {
  border-color: color-mix(in srgb, var(--instr-amber-fg) 35%, transparent);
  background: var(--instr-amber-bg);
  color: var(--instr-amber-fg);
}

/* =============================================================================
   Student shell + design-system primitives (Task 1). Follows the wireframe
   *roughly* — blue/white language, not exact tokens. Mirrors the "Instructor
   shell" section above: re-colors the shared .sidebar/.nav__* rules rather
   than duplicating the nav layout for a third sidebar variant.
   ========================================================================== */

/* ---- Student shell -------------------------------------------------------- */

.sidebar--student {
  --sidebar-bg: var(--student-sidebar-bg);
  --sidebar-text: var(--student-sidebar-text);
  --sidebar-text-strong: #ffffff;
  --sidebar-active: rgba(255, 255, 255, 0.16);
}

.sidebar--student .brand {
  padding: 0.35rem 0.5rem 0.5rem;
}

.sidebar--student .brand__name {
  color: #ffffff;
  font-size: 1.15rem;
}

.student-preview-pill {
  align-self: flex-start;
  margin: 0 0.5rem 1rem;
  padding: 0.2rem 0.55rem;
  border: 1px solid rgba(255, 255, 255, 0.32);
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.14);
  color: #ffffff;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.preview-mode-label {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 650;
  white-space: nowrap;
}

/* ---- Practice context panel (sidebar, in-session only) -------------------- */

.practice-context-slot:not(:empty) {
  margin-top: 0.5rem;
}

.practice-context {
  margin: 0 0.5rem;
  padding: 0.9rem 0.95rem;
  border-radius: var(--radius-sm);
  /* Recessed, not raised: a white overlay lifts the panel toward the sidebar
     text and drops this block under WCAG AA (3.86:1). Darkening instead keeps
     the same visual separation while the text clears 4.5:1 with margin. */
  background: rgba(0, 0, 0, 0.14);
}

.practice-context__eyebrow {
  margin: 0 0 0.2rem;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.75);
}

.practice-context__lo {
  margin: 0 0 0.6rem;
  font-weight: 650;
  color: #ffffff;
}

.practice-context__status {
  margin: 0 0 0.4rem;
  font-size: 0.82rem;
  color: rgba(255, 255, 255, 0.92);
}

.practice-context__counts {
  margin: 0;
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.75);
}

.practice-context__actions {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  margin-top: 0.75rem;
  padding-top: 0.6rem;
  border-top: 1px solid rgba(255, 255, 255, 0.18);
}

.practice-context__actions .btn {
  width: 100%;
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.4);
}

.practice-context__actions .btn:hover {
  background: rgba(255, 255, 255, 0.12);
}

/* ---- Copyright / disclaimer footer (every student screen, PRD §4.1) ------- */

.copyright-footer {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.copyright-footer__line {
  margin: 0 0 0.35rem;
  font-size: 0.72rem;
  line-height: 1.4;
  color: var(--muted);
}

.copyright-footer__line:last-child {
  margin-bottom: 0;
}

/* ---- Breadcrumb ------------------------------------------------------------- */

.breadcrumb {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-bottom: 1rem;
  font-size: 0.85rem;
  color: var(--muted);
}

.breadcrumb__sep {
  opacity: 0.6;
}

/* ---- Progress row (Topic-list / LO-list row) -------------------------------- */

.progress-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.85rem;
  padding: 0.85rem 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.progress-row + .progress-row {
  margin-top: 0.5rem;
}

.progress-row__index {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--muted);
  font-weight: 650;
  font-size: 0.85rem;
}

.progress-row__text {
  flex: 1;
  min-width: 0;
}

.progress-row__title {
  margin: 0;
  font-weight: 600;
}

.progress-row__meta {
  margin: 0.2rem 0 0;
  color: var(--muted);
  font-size: 0.8rem;
}

.progress-row__continue {
  flex-basis: 100%;
  margin: -0.35rem 0 0 2.6rem;
  color: var(--accent);
  font-size: 0.8rem;
  font-weight: 650;
}

@media (max-width: 520px) {
  .progress-row {
    display: grid;
    grid-template-columns: 1.75rem minmax(0, 1fr);
    align-items: start;
  }

  .progress-row__text,
  .progress-row > .badge,
  .progress-row__continue {
    grid-column: 2;
  }

  .progress-row > .badge {
    justify-self: start;
  }

  .progress-row > .btn {
    grid-column: 1 / -1;
    width: 100%;
  }

  .progress-row__continue {
    margin: -0.2rem 0 0;
  }
}

/* ---- Exam Prep (Phase 3 WS-10) ------------------------------------------- */

.exam-home-entry,
.exam-live__header,
.exam-card__head,
.exam-controls,
.exam-breakdown-row__label,
.exam-history-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.exam-home-entry {
  margin-bottom: 1.5rem;
  padding: 1.1rem 1.25rem;
  border: 1px solid color-mix(in srgb, var(--student-sidebar-bg) 45%, var(--border));
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--student-sidebar-bg) 7%, var(--surface));
}

.exam-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}

.exam-card,
.exam-question,
.exam-score-card,
.exam-review,
.exam-history-row {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}

.exam-card,
.exam-question,
.exam-review {
  padding: 1.2rem 1.3rem;
}

.exam-card__title,
.exam-card__meta,
.exam-question__number,
.exam-review h3 {
  margin: 0;
}

.exam-card__meta,
.exam-question__number {
  margin-top: 0.55rem;
  color: var(--muted);
  font-size: 0.85rem;
}

.exam-live__header {
  align-items: flex-start;
}

.exam-timer {
  flex: 0 0 auto;
  margin: 0;
  padding: 0.55rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-family: var(--mono);
  font-weight: 700;
}

.exam-timer--warning {
  border-color: var(--down);
  color: var(--down);
}

.exam-question-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(2.6rem, 1fr));
  gap: 0.45rem;
  margin: 1rem 0;
}

.exam-question-grid__item {
  min-height: 2.6rem;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

.exam-question-grid__item.is-answered {
  border-color: var(--student-sidebar-bg);
  background: color-mix(in srgb, var(--student-sidebar-bg) 12%, var(--surface));
}

.exam-question-grid__item.is-current {
  outline: 3px solid color-mix(in srgb, var(--student-sidebar-bg) 28%, transparent);
}

.exam-question__stem {
  margin: 1rem 0;
  font-size: 1.05rem;
}

.exam-options {
  display: grid;
  gap: 0.6rem;
}

.exam-controls {
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 1rem;
}

.exam-score-card {
  display: inline-flex;
  align-items: baseline;
  gap: 0.8rem;
  margin-bottom: 1.5rem;
  padding: 1rem 1.4rem;
}

.exam-score-card__score {
  margin: 0;
  color: var(--student-sidebar-bg);
  font-size: 2rem;
  font-weight: 750;
}

.exam-score-card__label,
.exam-review-option__label {
  margin: 0;
  color: var(--muted);
  font-size: 0.8rem;
}

.exam-breakdown-row {
  margin-bottom: 0.8rem;
}

.exam-breakdown-row progress {
  width: 100%;
  height: 0.75rem;
  accent-color: var(--student-sidebar-bg);
}

.exam-breakdown-row__link {
  display: inline-block;
  margin-top: 0.25rem;
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 650;
}

.exam-review-list {
  margin-top: 1.5rem;
}

.exam-review + .exam-review {
  margin-top: 1rem;
}

.exam-review.is-correct {
  border-left: 4px solid var(--up);
}

.exam-review.is-missed {
  border-left: 4px solid var(--down);
}

.exam-review__stem {
  margin: 0.8rem 0;
}

.exam-review-option {
  margin-top: 0.6rem;
  padding: 0.7rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.exam-review-option.is-selected {
  border-color: var(--student-sidebar-bg);
}

.exam-review-option.is-answer {
  background: color-mix(in srgb, var(--up) 8%, var(--surface));
}

.exam-review-option__text > :first-child,
.exam-review-option__explanation > :first-child {
  margin-top: 0.25rem;
}

.exam-review-option__explanation {
  color: var(--muted);
  font-size: 0.88rem;
}

.exam-history-list {
  display: grid;
  gap: 0.65rem;
}

.exam-history-row {
  padding: 0.9rem 1rem;
  color: inherit;
  text-decoration: none;
}

.exam-history-row:hover {
  border-color: var(--student-sidebar-bg);
}

.exam-history-row__kind {
  font-weight: 700;
}

@media (max-width: 640px) {
  .exam-home-entry,
  .exam-live__header,
  .exam-card__head,
  .exam-history-row {
    align-items: flex-start;
    flex-direction: column;
  }
}

/* ---- My Courses card grid / join box (Figma screen 1) ----------------------- */

.course-tile__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.join-box {
  margin-top: 1.5rem;
  padding: 1.1rem 1.25rem;
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
}

.join-box__label {
  margin: 0 0 0.6rem;
  font-weight: 650;
  font-size: 0.9rem;
}

/* ---- Notification bell (Task 3, §4.3/§9.1) ---------------------------------- */

.notif-bell-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.notif-bell {
  position: relative;
}

.notif-bell__icon {
  position: relative;
  display: inline-block;
  width: 0.9rem;
  height: 0.82rem;
  margin-top: 0.08rem;
  border: 2px solid currentColor;
  border-bottom: 0;
  border-radius: 0.55rem 0.55rem 0.15rem 0.15rem;
}

.notif-bell__icon::before {
  content: '';
  position: absolute;
  left: -0.18rem;
  right: -0.18rem;
  bottom: -0.22rem;
  height: 2px;
  border-radius: 999px;
  background: currentColor;
}

.notif-bell__icon::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -0.42rem;
  width: 0.24rem;
  height: 0.24rem;
  border-radius: 50%;
  background: currentColor;
  transform: translateX(-50%);
}

.notif-bell__badge {
  position: absolute;
  top: 0.05rem;
  right: 0.05rem;
  min-width: 1.1rem;
  height: 1.1rem;
  padding: 0 0.3rem;
  border-radius: 999px;
  background: var(--down);
  color: #ffffff;
  font-size: 0.62rem;
  font-weight: 700;
  line-height: 1.1rem;
  text-align: center;
  pointer-events: none;
}

.notif-panel {
  position: absolute;
  top: calc(100% + 0.5rem);
  right: 0;
  width: min(22rem, 90vw);
  max-height: 24rem;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 100;
}

.notif-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding: 0.75rem 0.9rem;
  border-bottom: 1px solid var(--border);
  font-weight: 650;
  font-size: 0.85rem;
  position: sticky;
  top: 0;
  background: var(--surface);
}

.notif-panel__empty {
  padding: 1.25rem 0.9rem;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}

.notif-panel__list {
  display: flex;
  flex-direction: column;
}

.notif-item {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  width: 100%;
  padding: 0.65rem 0.9rem;
  border: 0;
  border-bottom: 1px solid var(--border);
  border-left: 3px solid transparent;
  border-radius: 0;
  background: none;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s;
}

.notif-item__icon {
  flex: 0 0 auto;
  width: 0.55rem;
  height: 0.55rem;
  margin-top: 0.28rem;
  border-radius: 50%;
  background: var(--accent);
  color: var(--muted);
}

.notif-item__icon--elevated {
  position: relative;
  width: 1rem;
  height: 1rem;
  margin-top: 0.05rem;
  border: 1.5px solid var(--down);
  background: transparent;
}

.notif-item__icon--elevated::after {
  content: '!';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--down);
  font-size: 0.72rem;
  font-weight: 800;
  line-height: 1;
}

.notif-item:last-child {
  border-bottom: none;
}

.notif-item:hover {
  background: var(--surface-2);
}

.notif-item--unread {
  background: color-mix(in srgb, var(--accent) 6%, transparent);
}

.notif-item--elevated {
  border-left-color: var(--warn);
  background: color-mix(in srgb, var(--warn) 10%, transparent);
}

.notif-item--elevated.notif-item--unread {
  background: color-mix(in srgb, var(--warn) 16%, transparent);
}

.notif-item--elevated .notif-item__icon {
  color: var(--warn);
}

.notif-item__body {
  min-width: 0;
  flex: 1;
}

.notif-item__text {
  margin: 0;
  font-size: 0.83rem;
  line-height: 1.35;
  color: var(--text);
}

.notif-item__time {
  display: block;
  margin-top: 0.2rem;
  font-size: 0.72rem;
  color: var(--muted);
}

/* Notification landing highlight: a notification click deep-links into the
   flag queue (see client/src/notification-target.ts), and this is what marks
   the row it landed on. Uses outline rather than border so the ring does not
   reflow the grid-based .flag-row layout. */
.flag-group--highlight,
.card--highlight {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
  animation: notif-landing 2.4s ease-out;
}

@keyframes notif-landing {
  0%,
  40% {
    background-color: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  100% {
    background-color: transparent;
  }
}

@media (prefers-reduced-motion: reduce) {
  .flag-group--highlight,
  .card--highlight {
    animation: none;
  }
}

/* Variable Definitions table on the parameterization panel (design spec
   2026-08-05). One table for both drawn slots and computed values, so an
   instructor reads every number a student can see in one place. Column order
   matches the header in param-config.ts. */
.vardef__head,
.vardef__row {
  display: grid;
  grid-template-columns:
    minmax(0, 1.1fr) minmax(0, 1.7fr)
    minmax(0, 0.6fr) minmax(0, 0.6fr) minmax(0, 1.9fr) minmax(0, 0.7fr) auto;
  gap: 0.5rem;
  align-items: center;
  padding: 0.35rem 0;
}

.vardef__head {
  font-size: 0.8rem;
  font-weight: 650;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}

.vardef__row {
  border-bottom: 1px solid var(--border);
}

/* The variable as it appears in the stem. `[NAME]` reads far better than the
   stored `{{NAME}}`; the storage format is unchanged. */
.slot-chip {
  font-family: var(--mono);
  font-size: 0.85rem;
  padding: 0.1rem 0.4rem;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  white-space: nowrap;
}

.vardef__var {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  align-items: flex-start;
}

.vardef__warn {
  font-size: 0.7rem;
  color: var(--warn);
}

.vardef__na {
  display: flex;
  gap: 0.35rem;
  color: var(--muted);
  font-size: 0.85rem;
}

.vardef__type {
  font-size: 0.8rem;
  color: var(--muted);
}

.verification-banner {
  padding: 0.65rem 0.85rem;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  line-height: 1.45;
}

.verification-banner--ok {
  background: var(--ok-bg);
  color: var(--ok-fg);
}

.verification-banner--fail {
  background: var(--err-bg);
  color: var(--err-fg);
}

@media (max-width: 900px) {
  .vardef__head {
    display: none;
  }

  .vardef__row {
    grid-template-columns: 1fr;
    padding: 0.6rem 0;
  }
}

/* Worked example on the question detail view: what a STUDENT sees, rendered
   from one server-side sample draw. The editor above it shows the raw
   {{placeholder}} template, which is right for editing and unreadable for
   judging the question. */
.question-sample {
  margin: 1rem 0;
  padding: 0.9rem 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

.question-sample__stem {
  margin: 0.5rem 0 0.75rem;
  line-height: 1.55;
}

/* Stem and option text are rendered markdown, so they arrive wrapped in block
   elements. Collapse the outer margins so the panel keeps the tight spacing it
   had when these were plain strings. */
.question-sample__stem > :first-child,
.question-sample__text > :first-child,
.question-sample__explanation > :first-child {
  margin-top: 0;
}

.question-sample__stem > :last-child,
.question-sample__text > :last-child,
.question-sample__explanation > :last-child {
  margin-bottom: 0;
}

.question-sample__text {
  min-width: 0;
}

.question-sample__options {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  /* Roomier than the 0.4rem this had when options were one line each: rows now
     carry a rendered explanation, so adjacent options need visible separation. */
  gap: 0.75rem;
}

.question-sample__option {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  /* The explanation is a full-width child that WRAPS onto its own line — the
     option text and its correct badge stay on the first line. */
  flex-wrap: wrap;
}

/* The rendered rationale, indented past the A/B/C/D key so that column still
   reads as a column. Display math (`$$…$$`) can be wide, so it scrolls inside
   this block rather than widening the page. */
.question-sample__explanation {
  flex-basis: 100%;
  margin-left: 2rem;
  padding-left: 0.6rem;
  border-left: 2px solid var(--border);
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.5;
  overflow-x: auto;
}

.question-sample__key {
  font-weight: 650;
  min-width: 1.4rem;
  color: var(--muted);
}

.question-sample__option--correct .question-sample__key {
  color: var(--ok-fg);
}

.question-sample__badge {
  font-size: 0.75rem;
  padding: 0.1rem 0.45rem;
  border-radius: var(--radius-sm);
  background: var(--ok-bg);
  color: var(--ok-fg);
}

/* Parameterization page layout. These class names were referenced in the
   markup but never had any CSS, so every block sat flush against the next —
   the add-variable buttons, the verification banner and the preview controls
   ran together as one undifferentiated stack. Spacing is applied per block
   rather than as a flex `gap` on the container, because the table header and
   its two row groups (drawn, then computed) must stay tight against each
   other to read as a single table. */
.param-config-layout > .detail-section-title {
  margin: 1.75rem 0 0.5rem;
}

.param-config-layout > .detail-section-title:first-child {
  margin-top: 0;
}

.param-config-layout > .form-field__help {
  margin: 0 0 0.75rem;
}

.param-config__stem {
  margin: 0;
  padding: 0.85rem 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  line-height: 1.8;
}

/* Clear of the table above and the banner below. */
.param-config__add {
  margin-top: 1rem;
}

.param-config__verification:not(:empty),
.param-config__error:not(:empty) {
  margin-top: 1.25rem;
}

.param-config-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1.5rem;
}

.param-preview {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}

.param-preview__warnings {
  margin: 0;
  padding-left: 1.1rem;
  color: var(--warn);
  font-size: 0.85rem;
}

/* =============================================================================
   Phase 5 — Course-as-Project experience

   Canvas contributes the clear course/project boundary; modern agent tools
   contribute the compact rail, persistent context, and task-first workspace.
   These rules intentionally sit at the end while the remaining legacy views
   migrate onto the shared Project shell.
   ========================================================================== */

.app-shell {
  transition: grid-template-columns 180ms ease;
}

.app-shell--instructor.is-collapsed {
  grid-template-columns: var(--sidebar-collapsed-w) minmax(0, 1fr);
}

.sidebar--instructor {
  padding: 0.9rem 0.75rem;
  overflow-x: hidden;
}

.sidebar__brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.45rem;
}

.sidebar__brand-row .brand {
  min-width: 0;
  padding: 0.3rem 0.35rem 0.4rem;
  text-decoration: none;
}

.brand__mark {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-weight: 780;
}

.sidebar__collapse {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 8px;
  background: transparent;
  color: #fff;
  font: 700 1.25rem/1 var(--ui);
  cursor: pointer;
}

.sidebar__collapse:hover,
.sidebar__collapse:focus-visible {
  background: rgba(255, 255, 255, 0.12);
}

.nav__section {
  display: flex;
  flex-direction: column;
  gap: 0.12rem;
}

.nav__section[hidden] {
  display: none;
}

.sidebar--instructor .nav {
  gap: 0.2rem;
}

.sidebar--instructor .nav__group {
  margin-top: 0.9rem;
  color: rgba(255, 255, 255, 0.82);
}

.sidebar--instructor .nav__link {
  min-height: 2.45rem;
  padding: 0.45rem 0.55rem;
  border: 1px solid transparent;
}

.sidebar--instructor .nav__link--active {
  border-color: rgba(255, 255, 255, 0.1);
  background: rgba(9, 25, 14, 0.3);
  box-shadow: none;
}

.nav__glyph {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 1.65rem;
  height: 1.65rem;
  border-radius: 7px;
  font-size: 0.82rem;
  font-weight: 750;
}

.nav__glyph--step {
  border: 1px solid rgba(255, 255, 255, 0.22);
  font-family: var(--mono);
  font-size: 0.67rem;
}

.course-context {
  margin: 0.15rem 0 0.55rem;
  padding: 0.65rem;
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 11px;
  background: rgba(0, 0, 0, 0.13);
}

.course-context[hidden] {
  display: none;
}

.course-context__back {
  display: inline-block;
  margin-bottom: 0.55rem;
  color: rgba(255, 255, 255, 0.72);
  font-size: 0.68rem;
  font-weight: 650;
  text-decoration: none;
}

.course-context__back:hover {
  color: #fff;
}

.course-context__project {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.course-context__mark {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.13);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 800;
}

.course-context__body,
.course-context__name,
.course-context__meta {
  display: block;
  min-width: 0;
}

.course-context__body {
  overflow: hidden;
}

.course-context__name,
.course-context__meta {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.course-context__name {
  color: #fff;
  font-size: 0.76rem;
}

.course-context__meta {
  margin-top: 0.1rem;
  color: rgba(255, 255, 255, 0.65);
  font-size: 0.61rem;
}

.app-shell--instructor.is-collapsed .sidebar--instructor {
  align-items: stretch;
  padding-inline: 0.55rem;
}

.app-shell--instructor.is-collapsed .sidebar__brand-row {
  flex-direction: column;
}

.app-shell--instructor.is-collapsed .brand__name,
.app-shell--instructor.is-collapsed .instructor-pill,
.app-shell--instructor.is-collapsed .nav__group,
.app-shell--instructor.is-collapsed .nav__text,
.app-shell--instructor.is-collapsed .course-context__back,
.app-shell--instructor.is-collapsed .course-context__body,
.app-shell--instructor.is-collapsed .sidebar__foot {
  display: none;
}

.app-shell--instructor.is-collapsed .sidebar__brand-row .brand {
  padding-inline: 0;
}

.app-shell--instructor.is-collapsed .course-context {
  display: grid;
  place-items: center;
  padding: 0.45rem;
}

.app-shell--instructor.is-collapsed .course-context[hidden] {
  display: none;
}

.app-shell--instructor.is-collapsed .course-context__project {
  justify-content: center;
}

.app-shell--instructor.is-collapsed .nav__link {
  justify-content: center;
  padding-inline: 0.35rem;
}

.app-shell--instructor.is-collapsed .nav__glyph {
  width: 2rem;
  height: 2rem;
}

/* Course project dashboard (Canvas-like entry, FinanceBot-native styling). */

.course-projects__toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.1rem;
}

.course-projects__controls {
  display: flex;
  flex: 1;
  gap: 0.65rem;
  max-width: 42rem;
}

.course-projects__search {
  min-width: 14rem;
}

.course-projects__filter {
  width: auto;
  min-width: 9.5rem;
}

.course-projects__count {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 650;
}

.course-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}

.course-card {
  display: flex;
  min-height: 18rem;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  gap: 0;
  overflow: hidden;
  padding: 0;
  border-radius: 16px;
}

.course-card:hover {
  border-color: color-mix(in srgb, var(--instr-green-fg) 45%, var(--border));
  box-shadow: 0 16px 38px -24px rgba(20, 64, 34, 0.46);
  transform: translateY(-2px);
}

.course-card:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
  outline-offset: 2px;
}

.course-card__cover {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  min-height: 8rem;
  padding: 1rem;
  color: #fff;
  background: linear-gradient(145deg, #245f35, #163d24);
}

.course-card--tone-1 .course-card__cover { background: linear-gradient(145deg, #265d68, #173b43); }
.course-card--tone-2 .course-card__cover { background: linear-gradient(145deg, #495b86, #2d365d); }
.course-card--tone-3 .course-card__cover { background: linear-gradient(145deg, #75563e, #4b3526); }
.course-card--tone-4 .course-card__cover { background: linear-gradient(145deg, #685179, #43324f); }
.course-card--tone-5 .course-card__cover { background: linear-gradient(145deg, #4d6265, #2c3e41); }

.course-card__code {
  z-index: 1;
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 750;
  letter-spacing: 0.02em;
}

.course-card__cover .badge {
  z-index: 1;
}

.course-card__monogram {
  position: absolute;
  right: 0.85rem;
  bottom: -0.55rem;
  color: rgba(255, 255, 255, 0.13);
  font-size: 4.8rem;
  font-weight: 800;
  letter-spacing: -0.08em;
  line-height: 1;
}

.course-card__main {
  flex: 1;
  padding: 1.05rem 1.1rem 0.75rem;
}

.course-card__title {
  font-size: 1rem;
  line-height: 1.35;
}

.course-card__footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin: 0 1.1rem;
  padding: 0.8rem 0 1rem;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.74rem;
}

.course-card__footer strong {
  color: var(--instr-green-fg);
}

.course-projects__empty {
  grid-column: 1 / -1;
}

/* Course project home / Launch Cockpit. */

.view--course-project {
  max-width: 1180px;
}

.project-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  margin-bottom: 1rem;
  padding: clamp(1.25rem, 3vw, 2rem);
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--instr-green-fg) 18%, var(--border));
  border-radius: 18px;
  background:
    radial-gradient(circle at 95% 15%, color-mix(in srgb, var(--instr-green-bg) 70%, transparent) 0, transparent 36%),
    var(--surface);
}

.project-hero__eyebrow,
.project-panel__eyebrow {
  margin: 0 0 0.35rem;
  color: var(--instr-green-fg);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.project-hero__title {
  font-size: clamp(1.65rem, 3vw, 2.4rem);
  letter-spacing: -0.035em;
}

.project-hero__meta {
  margin: 0.5rem 0 0;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.8rem;
}

.project-hero__actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 0.65rem;
}

.project-hero__status {
  padding: 0.35rem 0.65rem;
  border-radius: 999px;
  background: var(--instr-gray-bg);
  color: var(--instr-gray-fg);
  font-size: 0.7rem;
  font-weight: 750;
}

.project-hero__status--published { background: var(--instr-green-bg); color: var(--instr-green-fg); }
.project-hero__status--archived { background: var(--instr-gray-bg); color: var(--instr-gray-fg); }

.course-flow {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0;
  margin-bottom: 1rem;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
}

.course-flow__step {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  padding: 0.8rem;
  color: var(--text);
  text-decoration: none;
}

.course-flow__step + .course-flow__step {
  border-left: 1px solid var(--border);
}

.course-flow__step:hover {
  background: var(--surface-2);
}

.course-flow__number {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 1.65rem;
  height: 1.65rem;
  border-radius: 99px;
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
  font-family: var(--mono);
  font-size: 0.67rem;
  font-weight: 800;
}

.course-flow__step--not-started .course-flow__number,
.course-flow__step--blocked .course-flow__number {
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--muted);
}

.course-flow__step--blocked .course-flow__body {
  opacity: 0.68;
}

.course-flow__step--in-progress .course-flow__number {
  background: color-mix(in srgb, var(--accent) 16%, var(--surface));
  color: var(--accent);
}

.course-flow__step--needs-attention .course-flow__number {
  background: color-mix(in srgb, var(--down) 13%, var(--surface));
  color: var(--down);
}

.course-flow__step--ready .course-flow__number,
.course-flow__step--complete .course-flow__number {
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
}

.course-flow__step--complete .course-flow__number {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--instr-green-fg) 28%, transparent);
}

.course-flow__body,
.course-flow__body strong,
.course-flow__body span {
  display: block;
  min-width: 0;
}

.course-flow__body strong,
.course-flow__body span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.course-flow__body strong { font-size: 0.75rem; }
.course-flow__body span { margin-top: 0.12rem; color: var(--muted); font-size: 0.64rem; }

.project-cockpit {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(18rem, 0.8fr);
  gap: 1rem;
  align-items: start;
}

.project-panel,
.project-explore {
  padding: 1.1rem;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--surface);
}

.project-panel__heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.85rem;
}

.project-panel__heading .section-title,
.project-panel__snapshot-title {
  margin: 0;
}

.project-panel__count {
  display: grid;
  place-items: center;
  min-width: 1.8rem;
  height: 1.8rem;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 750;
}

.project-panel--status .cockpit-readiness {
  margin: 0 0 1rem;
  padding: 0;
  border: 0;
  background: transparent;
}

.project-panel__snapshot-title {
  margin-bottom: 0.65rem;
  font-size: 0.92rem;
}

.project-panel--status .stat-tile-row {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.5rem;
  margin: 0;
}

.project-panel--status .stat-tile {
  padding: 0.7rem;
}

.project-panel--status .stat-tile__value {
  font-size: 1.35rem;
}

.project-panel--status .stat-tile__label {
  font-size: 0.65rem;
}

.project-panel .cockpit-checklist {
  margin-bottom: 0;
}

.workflow-actions__next-label {
  margin: 0;
  color: var(--instr-green-fg);
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.workflow-action--primary {
  min-height: 7rem;
}

.workflow-actions__upcoming {
  margin-top: 0.2rem;
  border-top: 1px solid var(--border);
}

.workflow-actions__upcoming > summary {
  padding: 0.85rem 0.25rem 0.25rem;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.75rem;
  font-weight: 700;
}

.workflow-actions--secondary {
  margin-top: 0.5rem;
}

.workflow-actions--secondary .workflow-action {
  min-height: 0;
  padding: 0.75rem;
}

.project-explore {
  margin-top: 1rem;
}

/* Knowledge Workspace stays one workspace instead of stretching the page. */

@media (min-width: 1101px) {
  .knowledge-workspace {
    height: clamp(610px, calc(100dvh - 12rem), 820px);
    min-height: 0;
  }

  .workspace-file-list {
    max-height: none;
  }

  .knowledge-workspace__assistant,
  .knowledge-workspace__files,
  .knowledge-workspace__inspector {
    overflow: hidden;
  }

  .workspace-activity {
    max-height: 12.5rem;
    overflow: auto;
  }
}

.workspace-file-list {
  padding-right: 0.15rem;
}

.workspace-file-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.2rem;
  border: 1px solid transparent;
  border-radius: 10px;
}

.workspace-file-row:hover,
.workspace-file-row:focus-within,
.workspace-file-row--selected {
  border-color: color-mix(in srgb, var(--instr-green-fg) 22%, var(--border));
  background: var(--surface);
}

.workspace-file-row .workspace-file {
  min-width: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.workspace-file__action {
  margin-right: 0.4rem;
  padding: 0.3rem 0.42rem;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--instr-red-fg);
  font: 650 0.62rem/1 var(--ui);
  cursor: pointer;
  opacity: 0;
  transition: opacity 120ms ease, background 120ms ease;
}

.workspace-file-row:hover .workspace-file__action,
.workspace-file-row:focus-within .workspace-file__action {
  opacity: 1;
}

.workspace-file__action:hover,
.workspace-file__action:focus-visible {
  background: var(--instr-red-bg);
}

.workspace-file__action--restore {
  color: var(--instr-green-fg);
}

.workspace-file__action--restore:hover,
.workspace-file__action--restore:focus-visible {
  background: var(--instr-green-bg);
}

@media (max-width: 1100px) {
  .knowledge-workspace {
    grid-template-columns: minmax(220px, 0.75fr) minmax(360px, 1.25fr);
  }

  .knowledge-workspace__assistant {
    border-right: 0;
  }

  .knowledge-workspace__inspector {
    grid-column: 1 / -1;
    min-height: 620px;
    border-top: 1px solid var(--border);
  }

  .course-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .course-flow {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .course-flow__step:nth-child(4) {
    border-left: 0;
    border-top: 1px solid var(--border);
  }

  .course-flow__step:nth-child(5) {
    border-top: 1px solid var(--border);
  }
}

@media (max-width: 860px) {
  .app-shell--instructor.is-collapsed {
    grid-template-columns: 1fr;
  }

  .app-shell--instructor.is-collapsed .sidebar--instructor {
    align-items: stretch;
    width: min(86vw, var(--sidebar-w));
    padding: 0.9rem 0.75rem;
  }

  .app-shell--instructor.is-collapsed .sidebar__brand-row {
    flex-direction: row;
  }

  .app-shell--instructor.is-collapsed .brand__name,
  .app-shell--instructor.is-collapsed .nav__group,
  .app-shell--instructor.is-collapsed .nav__text,
  .app-shell--instructor.is-collapsed .course-context__body,
  .app-shell--instructor.is-collapsed .sidebar__foot {
    display: block;
  }

  .app-shell--instructor.is-collapsed .instructor-pill,
  .app-shell--instructor.is-collapsed .course-context__back {
    display: inline-block;
  }

  .app-shell--instructor.is-collapsed .course-context {
    display: block;
    padding: 0.65rem;
  }

  .app-shell--instructor.is-collapsed .course-context[hidden] {
    display: none;
  }

  .app-shell--instructor.is-collapsed .course-context__project,
  .app-shell--instructor.is-collapsed .nav__link {
    justify-content: flex-start;
  }

  .sidebar__collapse {
    display: none;
  }

  .project-cockpit {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 680px) {
  .course-projects__toolbar,
  .course-projects__controls,
  .project-hero,
  .project-hero__actions {
    align-items: stretch;
    flex-direction: column;
  }

  .course-projects__search,
  .course-projects__filter {
    width: 100%;
    min-width: 0;
  }

  .course-list {
    grid-template-columns: 1fr;
  }

  .course-card {
    min-height: 16rem;
  }

  .course-flow {
    grid-template-columns: 1fr;
  }

  .course-flow__step + .course-flow__step,
  .course-flow__step:nth-child(4),
  .course-flow__step:nth-child(5) {
    border-top: 1px solid var(--border);
    border-left: 0;
  }

  .workspace-file__action {
    opacity: 1;
  }
}

/* =============================================================================
   Course-as-Project role shells — Student + Teaching Assistant
   ========================================================================== */

.app-shell--role.is-collapsed {
  grid-template-columns: var(--sidebar-collapsed-w) minmax(0, 1fr);
}

.app-shell--role .sidebar {
  padding: 0.9rem 0.75rem;
  overflow-x: hidden;
}

.app-shell--role .nav {
  gap: 0.2rem;
}

.app-shell--role .nav__group {
  color: rgba(255, 255, 255, 0.82);
}

.app-shell--role .nav__link {
  min-height: 2.45rem;
  padding: 0.45rem 0.55rem;
  border: 1px solid transparent;
}

.app-shell--role .nav__link--active {
  border-color: rgba(255, 255, 255, 0.12);
  background: rgba(8, 16, 34, 0.28);
  box-shadow: none;
}

.app-shell--role.is-collapsed .sidebar {
  align-items: stretch;
  padding-inline: 0.55rem;
}

.app-shell--role.is-collapsed .sidebar__brand-row {
  flex-direction: column;
}

.app-shell--role.is-collapsed .brand__name,
.app-shell--role.is-collapsed .student-preview-pill,
.app-shell--role.is-collapsed .instructor-pill,
.app-shell--role.is-collapsed .nav__group,
.app-shell--role.is-collapsed .nav__text,
.app-shell--role.is-collapsed .course-context__back,
.app-shell--role.is-collapsed .course-context__body,
.app-shell--role.is-collapsed .course-context__picker,
.app-shell--role.is-collapsed .sidebar__foot {
  display: none;
}

.app-shell--role.is-collapsed .sidebar__brand-row .brand {
  padding-inline: 0;
}

.app-shell--role.is-collapsed .course-context {
  display: grid;
  place-items: center;
  padding: 0.45rem;
}

.app-shell--role.is-collapsed .course-context[hidden] {
  display: none;
}

.app-shell--role.is-collapsed .course-context__project,
.app-shell--role.is-collapsed .nav__link {
  justify-content: center;
}

/* Practice replaces the normal icon nav with a rich context card. That card
 * has no meaningful 76px representation, so the desktop icon rail must hide
 * it instead of squeezing sentences and action labels into vertical text. */
.app-shell--role.is-collapsed .practice-context-slot {
  display: none;
}

.app-shell--role.is-collapsed .nav__glyph {
  width: 2rem;
  height: 2rem;
}

.sidebar--student .brand {
  padding: 0.3rem 0.35rem 0.4rem;
}

.sidebar--student .student-preview-pill {
  margin: 0.15rem 0.35rem 0.45rem;
}

.sidebar--ta .course-context__picker {
  margin-top: 0.65rem;
}

.sidebar--ta .ta-course-picker {
  min-height: 2.25rem;
  border-color: rgba(255, 255, 255, 0.16);
  background: rgba(0, 0, 0, 0.16);
  color: #fff;
  font-size: 0.7rem;
}

/* Student course-project dashboard. */

.student-projects__header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}

.view--student-projects .theme-grid {
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
}

.student-course-card {
  gap: 0;
  padding: 0;
  overflow: hidden;
  transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
}

.student-course-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--course-color) 38%, var(--border));
  box-shadow: 0 18px 36px -26px color-mix(in srgb, var(--course-color) 70%, transparent);
}

.student-course-card__cover {
  display: flex;
  min-height: 7.5rem;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.1rem;
  background:
    radial-gradient(circle at 85% 10%, rgba(255, 255, 255, 0.2), transparent 34%),
    var(--course-color);
  color: #fff;
}

.student-course-card__code {
  font-size: 1.25rem;
  font-weight: 760;
  letter-spacing: -0.02em;
}

.student-course-card__project {
  align-self: flex-start;
  padding: 0.18rem 0.45rem;
  border: 1px solid rgba(255, 255, 255, 0.28);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.12);
  font-size: 0.63rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.student-course-card__body {
  display: flex;
  min-height: 13.5rem;
  flex-direction: column;
  gap: 0.85rem;
  padding: 1.1rem;
}

.student-course-card__body > .btn {
  width: 100%;
  margin-top: auto;
}

.view--student-projects .join-box {
  margin-top: 2rem;
  padding: 1.35rem;
  border-style: solid;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.view--student-projects .join-box .section-title {
  margin-bottom: 0.35rem;
}

/* Student course home: one calm project summary followed by a clear journey. */

.student-course-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(190px, 0.3fr);
  gap: 2rem;
  margin-bottom: 1rem;
  padding: clamp(1.35rem, 3vw, 2rem);
  border: 1px solid color-mix(in srgb, var(--student-sidebar-bg) 24%, var(--border));
  border-radius: calc(var(--radius) + 4px);
  background:
    radial-gradient(circle at 90% 10%, color-mix(in srgb, var(--student-sidebar-bg) 14%, transparent), transparent 34%),
    var(--surface);
  box-shadow: var(--shadow);
}

.student-course-hero__title {
  font-size: clamp(1.8rem, 4vw, 2.65rem);
  letter-spacing: -0.035em;
}

.student-course-hero__meta,
.student-course-hero__lead {
  margin: 0.65rem 0 0;
  color: var(--muted);
}

.student-course-hero__lead {
  max-width: 45rem;
}

.student-course-hero__progress {
  align-self: center;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--student-sidebar-bg) 5%, var(--surface));
}

.student-course-hero__progress strong,
.student-course-hero__progress span {
  display: block;
}

.student-course-hero__progress strong {
  color: var(--student-sidebar-bg);
  font-size: 1.7rem;
}

.student-course-hero__progress span {
  margin: 0.15rem 0 0.7rem;
  color: var(--muted);
  font-size: 0.72rem;
}

.student-learning-flow {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: 1.25rem;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

.student-learning-flow__step {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 3.2rem;
  padding: 0.7rem 0.9rem;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 650;
}

.student-learning-flow__step + .student-learning-flow__step {
  border-left: 1px solid var(--border);
}

.student-learning-flow__step strong {
  display: grid;
  place-items: center;
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 50%;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 0.68rem;
}

.student-learning-flow__step.is-active {
  color: var(--text);
  background: color-mix(in srgb, var(--student-sidebar-bg) 7%, var(--surface));
}

.student-learning-flow__step.is-active strong {
  background: var(--student-sidebar-bg);
  color: #fff;
}

@media (max-width: 860px) {
  .app-shell--role.is-collapsed {
    grid-template-columns: 1fr;
  }

  .app-shell--role.is-collapsed .sidebar {
    align-items: stretch;
    width: min(86vw, var(--sidebar-w));
    padding: 0.9rem 0.75rem;
  }

  .app-shell--role.is-collapsed .sidebar__brand-row {
    flex-direction: row;
  }

  .app-shell--role.is-collapsed .brand__name,
  .app-shell--role.is-collapsed .nav__group,
  .app-shell--role.is-collapsed .nav__text,
  .app-shell--role.is-collapsed .course-context__body,
  .app-shell--role.is-collapsed .course-context__picker,
  .app-shell--role.is-collapsed .sidebar__foot {
    display: block;
  }

  .app-shell--role.is-collapsed .student-preview-pill,
  .app-shell--role.is-collapsed .instructor-pill,
  .app-shell--role.is-collapsed .course-context__back {
    display: inline-block;
  }

  .app-shell--role.is-collapsed .course-context {
    display: block;
    padding: 0.65rem;
  }

  .app-shell--role.is-collapsed .course-context[hidden] {
    display: none;
  }

  .app-shell--role.is-collapsed .course-context__project,
  .app-shell--role.is-collapsed .nav__link {
    justify-content: flex-start;
  }

  /* On small screens the sidebar is an off-canvas drawer rather than an icon
   * rail. A persisted desktop collapse preference must not hide its content. */
  .app-shell--role.is-collapsed .practice-context-slot:not(:empty) {
    display: block;
  }

  .student-course-hero {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 620px) {
  .student-projects__header {
    align-items: stretch;
    flex-direction: column;
  }

  .student-learning-flow {
    grid-template-columns: 1fr;
  }

  .student-learning-flow__step + .student-learning-flow__step {
    border-top: 1px solid var(--border);
    border-left: 0;
  }

  .view--student-projects .join-box .row {
    align-items: stretch;
    flex-direction: column;
  }

  .view--student-projects .join-box .btn {
    width: 100%;
  }
}

/* ---- Guided course setup --------------------------------------------------- */

.course-setup-guide {
  width: min(70rem, calc(100vw - 2rem));
}

.course-setup-guide__surface {
  display: flex;
  flex-direction: column;
  max-height: min(90dvh, 58rem);
  padding: 0;
  overflow: hidden;
}

.course-setup-guide__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1.25rem 1.4rem 1rem;
  border-bottom: 1px solid var(--border);
}

.course-setup-guide__eyebrow {
  margin: 0 0 0.4rem;
  color: var(--instr-green-fg);
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 750;
  letter-spacing: 0.14em;
}

.course-setup-guide__title {
  margin-bottom: 0.3rem;
  font-size: clamp(1.2rem, 2vw, 1.5rem);
}

.course-setup-guide__close {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 1.45rem;
  line-height: 1;
}

.course-setup-guide__progress {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}

.course-setup-guide__stage {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-width: 0;
  min-height: 4.15rem;
  padding: 0.65rem 0.75rem;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--muted);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.course-setup-guide__stage + .course-setup-guide__stage {
  border-left: 1px solid var(--border);
}

.course-setup-guide__stage:hover,
.course-setup-guide__stage:focus-visible {
  background: color-mix(in srgb, var(--instr-green-bg) 60%, var(--surface));
  color: var(--text);
}

.course-setup-guide__stage.is-active {
  border-bottom-color: var(--instr-green-fg);
  background: var(--surface);
  color: var(--text);
}

.course-setup-guide__stage-number {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 1.65rem;
  height: 1.65rem;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 750;
}

.course-setup-guide__stage--complete .course-setup-guide__stage-number,
.course-setup-guide__stage--ready .course-setup-guide__stage-number {
  border-color: color-mix(in srgb, var(--instr-green-fg) 35%, var(--border));
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
}

.course-setup-guide__stage--in-progress .course-setup-guide__stage-number {
  border-color: color-mix(in srgb, var(--instr-blue-fg) 35%, var(--border));
  background: var(--instr-blue-bg);
  color: var(--instr-blue-fg);
}

.course-setup-guide__stage--needs-attention .course-setup-guide__stage-number,
.course-setup-guide__stage--blocked .course-setup-guide__stage-number {
  border-color: color-mix(in srgb, var(--instr-amber-fg) 35%, var(--border));
  background: var(--instr-amber-bg);
  color: var(--instr-amber-fg);
}

.course-setup-guide__stage-copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 0.15rem;
}

.course-setup-guide__stage-copy strong,
.course-setup-guide__stage-copy small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.course-setup-guide__stage-copy strong {
  font-size: 0.76rem;
}

.course-setup-guide__stage-copy small {
  color: var(--muted);
  font-size: 0.65rem;
}

.course-setup-guide__live {
  min-height: 1px;
  margin: 0;
  padding: 0 1.4rem;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.76rem;
}

.course-setup-guide__live:not(:empty) {
  padding-top: 0.55rem;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid var(--border);
}

.course-setup-guide__live--success {
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
}

.course-setup-guide__live--error {
  background: var(--instr-red-bg);
  color: var(--instr-red-fg);
}

.course-setup-guide__body {
  min-height: 0;
  padding: 1.35rem 1.4rem 1.4rem;
  overflow: auto;
  overscroll-behavior: contain;
}

.course-setup-guide__screen-heading {
  margin-bottom: 1rem;
}

.course-setup-guide__screen-title {
  margin: 0;
  font-size: clamp(1.15rem, 2vw, 1.4rem);
  letter-spacing: -0.015em;
}

.course-setup-guide__screen-title:focus {
  outline: none;
}

.course-setup-guide__screen-description {
  max-width: 54rem;
  margin: 0.35rem 0 0;
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.55;
}

.course-setup-guide__choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.85rem;
}

.course-setup-guide__choice {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.85rem;
  min-height: 8.5rem;
  padding: 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
}

.course-setup-guide__choice:hover,
.course-setup-guide__choice:focus-visible {
  border-color: var(--instr-green-fg);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.course-setup-guide__choice.is-recommended {
  border-color: color-mix(in srgb, var(--instr-green-fg) 42%, var(--border));
  background: color-mix(in srgb, var(--instr-green-bg) 45%, var(--surface));
}

.course-setup-guide__choice > span:nth-child(2) {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 0.35rem;
}

.course-setup-guide__choice strong {
  line-height: 1.35;
}

.course-setup-guide__choice small {
  color: var(--muted);
  font-size: 0.77rem;
  line-height: 1.45;
}

.course-setup-guide__choice-icon,
.course-setup-guide__ai-icon,
.course-setup-guide__preview-icon {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 0.8rem;
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
  font-family: var(--mono);
  font-size: 0.72rem;
  font-weight: 750;
}

.course-setup-guide__choice-arrow {
  color: var(--instr-green-fg);
  font-size: 1.25rem;
}

.course-setup-guide__recommended {
  width: fit-content;
  color: var(--instr-green-fg);
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 750;
  letter-spacing: 0.1em;
}

.course-setup-guide__alert {
  margin: 0.9rem 0 0;
  padding: 0.75rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.5;
}

.course-setup-guide__alert--success {
  border-color: color-mix(in srgb, var(--instr-green-fg) 28%, var(--border));
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
}

.course-setup-guide__alert--error {
  border-color: color-mix(in srgb, var(--instr-red-fg) 28%, var(--border));
  background: var(--instr-red-bg);
  color: var(--instr-red-fg);
}

.course-setup-guide__actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  margin-top: 1.15rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}

.course-setup-guide__actions-primary {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.6rem;
}

.course-setup-guide__form {
  display: grid;
  gap: 1rem;
}

.course-setup-guide__lo-input {
  min-height: 11rem;
}

.course-setup-guide__hint {
  display: block;
  margin-top: 0.35rem;
  color: var(--muted);
  font-size: 0.73rem;
  line-height: 1.4;
}

.course-setup-guide__form-error {
  min-height: 1.15rem;
  margin: 0.4rem 0 0;
  color: var(--instr-red-fg);
  font-size: 0.78rem;
  line-height: 1.45;
}

.course-setup-guide__source-inputs {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(17rem, 0.85fr);
  gap: 0.85rem;
}

.course-setup-guide__source-inputs .upload-zone {
  min-height: 10rem;
  padding: 1.25rem;
}

.course-setup-guide__url-panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
}

.course-setup-guide__url-panel > p {
  margin: 0.3rem 0 0.75rem;
  color: var(--muted);
  font-size: 0.78rem;
}

.course-setup-guide__url-form {
  display: flex;
  gap: 0.5rem;
}

.course-setup-guide__upload-status {
  min-height: 1.1rem;
  margin: 0.55rem 0 0;
  color: var(--muted);
  font-size: 0.76rem;
}

.course-setup-guide__source-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.75rem;
}

.course-setup-guide__source-summary > * {
  padding: 0.25rem 0.55rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.7rem;
}

.course-setup-guide__source-summary > strong {
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
}

.course-setup-guide__source-list,
.course-setup-guide__generation-list,
.course-setup-guide__review-list {
  display: grid;
  gap: 0.55rem;
  max-height: min(38dvh, 24rem);
  margin-top: 0.75rem;
  padding-right: 0.2rem;
  overflow: auto;
}

.course-setup-guide__source {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 0.75rem;
  padding: 0.7rem 0.8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.course-setup-guide__source-format {
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.25rem;
  border-radius: 0.6rem;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.63rem;
  font-weight: 750;
}

.course-setup-guide__source-copy,
.course-setup-guide__generation-copy,
.course-setup-guide__review-copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 0.2rem;
}

.course-setup-guide__source-copy strong,
.course-setup-guide__source-copy small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.course-setup-guide__source-copy small,
.course-setup-guide__generation-copy small {
  color: var(--muted);
  font-size: 0.7rem;
}

.course-setup-guide__status,
.course-setup-guide__run-status {
  padding: 0.2rem 0.5rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 0.64rem;
  text-transform: capitalize;
}

.course-setup-guide__status--ready {
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
}

.course-setup-guide__status--processing {
  background: var(--instr-blue-bg);
  color: var(--instr-blue-fg);
}

.course-setup-guide__status--failed {
  background: var(--instr-red-bg);
  color: var(--instr-red-fg);
}

.course-setup-guide__empty {
  margin: 0;
  padding: 1.25rem;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
}

.course-setup-guide__ai-step,
.course-setup-guide__preview-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 1rem;
  padding: 1.1rem;
  border: 1px solid color-mix(in srgb, var(--instr-green-fg) 30%, var(--border));
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--instr-green-bg) 38%, var(--surface));
}

.course-setup-guide__ai-step h4,
.course-setup-guide__preview-card h4,
.course-setup-guide__run-list h4 {
  margin: 0;
  font-size: 0.9rem;
}

.course-setup-guide__ai-step p {
  margin: 0.3rem 0 0;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.5;
}

.course-setup-guide__hierarchy {
  display: grid;
  gap: 0.7rem;
  max-height: min(38dvh, 24rem);
  margin-top: 0.8rem;
  padding-right: 0.2rem;
  overflow: auto;
}

.course-setup-guide__draft-theme {
  padding: 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

.course-setup-guide__draft-theme.is-disabled {
  opacity: 0.62;
}

.course-setup-guide__draft-title,
.course-setup-guide__draft-lo {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.65rem;
}

.course-setup-guide__draft-title .input {
  font-weight: 700;
}

.course-setup-guide__draft-los {
  display: grid;
  gap: 0.5rem;
  margin: 0.65rem 0 0 1.65rem;
}

.course-setup-guide__draft-lo small {
  min-width: 6.8rem;
  color: var(--muted);
  font-size: 0.68rem;
  text-align: right;
}

.course-setup-guide__generation-row {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) auto minmax(10rem, 0.65fr);
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.course-setup-guide__generation-row.is-complete {
  border-color: color-mix(in srgb, var(--instr-green-fg) 25%, var(--border));
  background: color-mix(in srgb, var(--instr-green-bg) 28%, var(--surface));
}

/* The batch planner dialog (Question Workspace): same grid as the setup
   guide's inline version, inside a wide app-dialog. */
/* The dialog ELEMENT is what carries the width (31rem by default) — widening
   only the surface inside it is what produced a horizontal scrollbar. */
.app-dialog--wide {
  width: min(80rem, calc(100vw - 2rem));
}

.app-dialog--wide .app-dialog__surface {
  max-height: 90vh;
  overflow-y: auto;
}

.generation-plan__rows {
  display: grid;
  gap: 0.5rem;
  margin: 0.75rem 0;
}

.generation-plan__header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.25rem 0.75rem;
  font-size: 0.8rem;
  color: var(--muted);
}

.generation-plan__row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 0.75rem;
  padding: 0.6rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.generation-plan__row.is-excluded {
  opacity: 0.55;
}

/* Combination rows (multi-LO batch generation): instructor-added rows whose
   questions integrate a primary and up to two secondary objectives. Accented
   so they read as a different kind of row from the Auto plan's LO rows. */
.generation-plan__row--combo {
  border-left: 3px solid var(--instr-green-fg);
}

.generation-plan__combo-los {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.25rem 0.4rem;
}

.generation-plan__combo-los .generation-plan__plus {
  color: var(--muted);
  font-weight: 700;
}

.generation-plan__remove {
  align-self: start;
  padding: 0 0.35rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 1.1rem;
  line-height: 1.2;
  cursor: pointer;
}

.generation-plan__remove:hover {
  background: color-mix(in srgb, var(--text) 12%, transparent);
  color: var(--text);
}

.generation-plan__builder {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto;
  align-items: end;
  gap: 0.6rem;
  padding: 0.6rem 0.75rem;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
}

.generation-plan__builder .form-field__label {
  font-size: 0.72rem;
  color: var(--muted);
}

.generation-plan__builder-note {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--muted);
  font-size: 0.72rem;
}

@media (max-width: 56rem) {
  .generation-plan__builder {
    grid-template-columns: 1fr;
  }
}

.generation-plan__select {
  margin-top: 0.2rem;
}

@media (max-width: 56rem) {
  .generation-plan__row {
    grid-template-columns: auto minmax(0, 1fr);
  }
  .generation-plan__grid {
    grid-column: 1 / -1;
  }
}

.generation-plan__copy {
  display: grid;
  gap: 0.15rem;
}

.generation-plan__copy small {
  color: var(--muted);
  font-size: 0.72rem;
}

.generation-plan__grid {
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 0.5rem 0.85rem;
}

.generation-plan__tier {
  display: grid;
  gap: 0.3rem;
}

.generation-plan__tier > small {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
  text-transform: capitalize;
}

.generation-plan__kinds {
  display: flex;
  gap: 0.4rem;
}

.generation-plan__kind {
  display: grid;
  gap: 0.15rem;
  font-size: 0.68rem;
  color: var(--muted);
}

.generation-plan__count {
  width: 3.6rem;
  padding: 0.3rem 0.4rem;
  font-family: var(--mono);
  text-align: center;
}

.generation-plan__count:disabled {
  opacity: 0.5;
}

/* The batch planner: a row is the LO's copy plus a tier grid, each tier a
   pair of steppers (calculation / conceptual). */
.course-setup-guide__generation-row:has(.course-setup-guide__plan-grid) {
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
}

.course-setup-guide__plan-grid {
  display: grid;
  grid-template-columns: repeat(3, auto);
  gap: 0.5rem 0.85rem;
}

.course-setup-guide__plan-tier {
  display: grid;
  gap: 0.3rem;
}

.course-setup-guide__plan-tier > small {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
  text-transform: capitalize;
}

.course-setup-guide__plan-kinds {
  display: flex;
  gap: 0.4rem;
}

.course-setup-guide__plan-kind {
  display: grid;
  gap: 0.15rem;
  font-size: 0.68rem;
  color: var(--muted);
}

.course-setup-guide__plan-count {
  width: 3.6rem;
  padding: 0.3rem 0.4rem;
  font-family: var(--mono);
  text-align: center;
}

.course-setup-guide__plan-count:disabled {
  opacity: 0.5;
}

.course-setup-guide__coverage {
  font-family: var(--mono);
  font-size: 0.7rem;
}

.course-setup-guide__eligibility {
  color: var(--muted);
  font-size: 0.7rem;
  text-align: right;
}

.course-setup-guide__eligibility.is-ready {
  color: var(--instr-green-fg);
}

.course-setup-guide__run-list {
  display: grid;
  gap: 0.45rem;
  margin-top: 0.85rem;
  padding: 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

.course-setup-guide__run {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.65rem;
  padding: 0.45rem 0;
}

.course-setup-guide__run + .course-setup-guide__run {
  border-top: 1px solid var(--border);
}

.course-setup-guide__run > span:nth-child(2) {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 0.15rem;
}

.course-setup-guide__run small {
  overflow: hidden;
  color: var(--muted);
  font-size: 0.68rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.course-setup-guide__run-dot {
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: var(--instr-blue-fg);
}

.course-setup-guide__run--completed .course-setup-guide__run-dot {
  background: var(--instr-green-fg);
}

.course-setup-guide__run--failed .course-setup-guide__run-dot,
.course-setup-guide__run--partial .course-setup-guide__run-dot {
  background: var(--instr-red-fg);
}

.course-setup-guide__review-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 1rem;
  padding: 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
}

.course-setup-guide__review-copy > strong {
  display: -webkit-box;
  overflow: hidden;
  font-size: 0.82rem;
  font-weight: 600;
  line-height: 1.45;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.course-setup-guide__review-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.course-setup-guide__review-meta span {
  padding: 0.15rem 0.4rem;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 0.62rem;
  text-transform: capitalize;
}

.course-setup-guide__review-options {
  display: grid;
  gap: 0.35rem;
  margin: 0.55rem 0 0;
  padding: 0;
  list-style: none;
}

.course-setup-guide__review-options li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: start;
  gap: 0.5rem;
  padding: 0.45rem 0.55rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 0.72rem;
}

.course-setup-guide__review-options li.is-correct {
  border-color: color-mix(in srgb, var(--instr-green-fg) 34%, var(--border));
  background: color-mix(in srgb, var(--instr-green-bg) 42%, var(--surface));
}

.course-setup-guide__option-key {
  display: grid;
  place-items: center;
  width: 1.45rem;
  height: 1.45rem;
  border-radius: 50%;
  background: var(--surface);
  font-family: var(--mono);
  font-weight: 750;
}

.course-setup-guide__option-copy {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 0.15rem;
  line-height: 1.4;
}

.course-setup-guide__option-copy small {
  color: var(--muted);
  font-size: 0.66rem;
}

.course-setup-guide__option-role {
  color: var(--muted);
  font-size: 0.63rem;
  font-weight: 700;
  white-space: nowrap;
}

.course-setup-guide__review-options li.is-correct .course-setup-guide__option-role {
  color: var(--instr-green-fg);
}

.course-setup-guide__complete-state {
  display: grid;
  place-items: center;
  gap: 0.35rem;
  padding: 2rem 1rem;
  border: 1px dashed color-mix(in srgb, var(--instr-green-fg) 38%, var(--border));
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--instr-green-bg) 30%, var(--surface));
  text-align: center;
}

.course-setup-guide__complete-state > span {
  display: grid;
  place-items: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 50%;
  background: var(--instr-green-bg);
  color: var(--instr-green-fg);
  font-weight: 800;
}

.course-setup-guide__complete-state p {
  margin: 0;
  color: var(--muted);
  font-size: 0.78rem;
}

.course-setup-guide__preview-card {
  grid-template-columns: auto minmax(0, 1fr);
}

.course-setup-guide__preview-card ul {
  margin: 0.55rem 0 0;
  padding-left: 1.1rem;
  color: var(--muted);
  font-size: 0.8rem;
  line-height: 1.6;
}

@media (max-width: 900px) {
  .course-setup-guide__stage-detail {
    display: none;
  }

  .course-setup-guide__stage {
    min-height: 3.5rem;
  }

  .course-setup-guide__source-inputs,
  .course-setup-guide__choices {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 680px) {
  .course-setup-guide {
    width: calc(100vw - 1rem);
  }

  .course-setup-guide__surface {
    max-height: 96dvh;
  }

  .course-setup-guide__header,
  .course-setup-guide__body {
    padding-right: 1rem;
    padding-left: 1rem;
  }

  .course-setup-guide__body {
    padding-bottom: max(1.4rem, env(safe-area-inset-bottom));
  }

  .course-setup-guide__progress {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .course-setup-guide__stage {
    min-height: 4.4rem;
    flex-direction: column;
    justify-content: center;
    gap: 0.3rem;
    padding: 0.4rem 0.2rem;
    text-align: center;
  }

  .course-setup-guide__stage-copy strong {
    overflow: visible;
    font-size: 0.6rem;
    line-height: 1.15;
    text-overflow: clip;
    white-space: normal;
  }

  .course-setup-guide__stage-copy small {
    overflow: visible;
    font-size: 0.52rem;
    line-height: 1.1;
    text-overflow: clip;
    white-space: normal;
  }

  .course-setup-guide__actions {
    align-items: stretch;
    flex-direction: column-reverse;
  }

  .course-setup-guide__actions-primary {
    align-items: stretch;
    flex-direction: column;
  }

  .course-setup-guide__actions .btn {
    width: 100%;
  }

  .course-setup-guide__url-form,
  .course-setup-guide__source,
  .course-setup-guide__generation-row,
  .course-setup-guide__review-item,
  .course-setup-guide__ai-step {
    grid-template-columns: 1fr;
  }

  .course-setup-guide__url-form {
    display: grid;
  }

  .course-setup-guide__source-format,
  .course-setup-guide__status,
  .course-setup-guide__source .btn,
  .course-setup-guide__ai-icon {
    justify-self: start;
  }

  .course-setup-guide__eligibility {
    text-align: left;
  }

  .course-setup-guide__draft-title,
  .course-setup-guide__draft-lo {
    grid-template-columns: auto minmax(0, 1fr);
  }

  .course-setup-guide__draft-lo small {
    grid-column: 2;
    text-align: left;
  }
}

/* Optional role tutorials: the modal blocks background interaction and scrolls
   internally on small screens. The native inert state is restored on cleanup. */
.tutorial-layer { pointer-events: auto; z-index: 10002; }
.tutorial-popover { max-height: calc(100dvh - 36px); overflow-y: auto; }
.tutorial-help { max-width: 960px; margin-inline: auto; }
.tutorial-help__context { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.5rem; }
.tutorial-help__context > h3, .tutorial-help__context > p { flex-basis: 100%; }

/* Instructor analytics: compact evidence, readable without a chart library. */
.analytics-view { max-width: 1280px; margin-inline: auto; }
.analytics-view .card { padding: 1.35rem; }
.analytics-controls { display:flex; flex-wrap:wrap; align-items:end; gap:.75rem; }
.analytics-controls label, .analytics-view label { display:grid; gap:.35rem; }
.analytics-controls [aria-pressed="true"] { outline:2px solid currentColor; outline-offset:2px; }
.analytics-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1rem; }
.analytics-metric { display:grid; gap:.35rem; padding:.75rem; border:1px solid var(--border); border-radius:8px; }
.analytics-metric strong { font-size:1.6rem; }
.analytics-priority, .analytics-pattern { padding:1rem; border:1px solid var(--border); border-radius:8px; display:grid; gap:.5rem; overflow-wrap:anywhere; }
.analytics-pattern-list { display:grid; gap:.75rem; }
.analytics-theme { border-top:1px solid var(--border); padding:.85rem 0; }
.analytics-theme summary { cursor:pointer; font-weight:600; }
.analytics-outcome { padding:.65rem 0; }
.analytics-bar { height:6px; background:var(--border); border-radius:4px; margin-top:.5rem; overflow:hidden; }
.analytics-bar span { display:block; height:100%; background:currentColor; opacity:.8; }
.analytics-table-wrap { overflow:auto; }
.analytics-table { width:100%; border-collapse:collapse; text-align:left; }
.analytics-table caption { text-align:left; margin-bottom:.6rem; }
.analytics-table th, .analytics-table td { padding:.65rem; border-bottom:1px solid var(--border); }
.analytics-distribution { overflow-wrap:anywhere; }
@media(max-width:700px) { .analytics-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); } .analytics-view .card { padding:1rem; } .analytics-controls { align-items:stretch; } .analytics-controls .input { max-width:100%; } }

/* Admin keeps a black sidebar in both user-selectable appearance modes. */
:root[data-admin="true"] {
  color-scheme: light;
  --bg: #f5f5f6;
  --surface: #ffffff;
  --surface-2: #f0f0f2;
  --border: #dedee2;
  --border-strong: #b7b8bf;
  --text: #17181c;
  --muted: #62646d;
  --accent: #202126;
  --accent-strong: #08090b;
  --accent-contrast: #ffffff;
  --instr-sidebar-bg: #0c0d0f;
  --instr-sidebar-text: #c5c6cc;
}

:root[data-admin="true"][data-theme="dark"] {
  color-scheme: dark;
  --bg: #08090b;
  --surface: #111214;
  --surface-2: #191a1e;
  --border: #303238;
  --border-strong: #51545d;
  --text: #f5f5f6;
  --muted: #aeb0b8;
  --accent: #f5f5f6;
  --accent-strong: #d9dade;
  --accent-contrast: #111214;
  --instr-sidebar-bg: #0c0d0f;
  --instr-sidebar-text: #c5c6cc;
  --instr-gray-bg: #27292e;
  --instr-gray-fg: #c5c6cc;
  --instr-blue-bg: #27292e;
  --instr-blue-fg: #ededf0;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
}

.app-shell--admin .sidebar {
  --muted: #aeb0b8;
  border-right: 1px solid #303238;
}

.app-shell--admin .brand__mark {
  background: #f5f5f6;
  color: #111214;
  border-color: #f5f5f6;
}

.app-shell--admin .instructor-pill {
  padding-inline: 0;
  background: transparent;
  color: var(--muted);
  font-size: 0.62rem;
  letter-spacing: 0.13em;
}

.app-shell--admin .sidebar--instructor .nav__link--active {
  background: #24262b;
  border-color: #44464c;
  color: #ffffff;
}

.app-shell--admin .sidebar--instructor .nav__link--active .nav__glyph {
  color: inherit;
}

.app-shell--admin .nav__link:not(.nav__link--active):hover {
  background: #24262b;
}

/* The sidebar stays dark even when the Admin content theme is light. */
.app-shell--admin .sidebar--instructor .nav__link:not(.nav__link--disabled):is(:hover, :focus, :active, .journey-current) {
  color: #ffffff;
}

.app-shell--admin .sidebar--instructor .nav__link.journey-current .nav__glyph {
  color: #183328;
}

.app-shell--admin .btn--primary,
.app-shell--admin .btn--instr-primary {
  background: var(--instr-dark);
  border-color: var(--instr-dark);
  color: #ffffff;
}

.app-shell--admin .btn--primary:hover,
.app-shell--admin .btn--instr-primary:hover {
  background: var(--instr-dark-hover);
  border-color: var(--instr-dark-hover);
}

.admin-topbar-badge {
  padding: 0.25rem 0.65rem;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  color: var(--text);
  font-size: 0.75rem;
  font-weight: 600;
}

/* Guided objective review: reading first, editing on demand. */
.course-setup-guide__objective-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.course-setup-guide__objective-topic { margin: 0 0 1.75rem; }
.course-setup-guide__objective-topic > header { margin-bottom: 0.5rem; }
.course-setup-guide__objective-topic h4 { margin: 0.2rem 0 0; font-size: 1.05rem; }
.course-setup-guide__objective-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--border);
  line-height: 1.5;
}
.course-setup-guide__objective-row > span { min-width: 0; overflow-wrap: anywhere; }
.course-setup-guide__objective-row > button { flex-shrink: 0; }

.course-setup-guide__objective-edit > div { display: flex; justify-content: flex-end; gap: 0.5rem; }

.course-setup-guide__form [hidden] { display: none; }
@media (max-width: 600px) {
